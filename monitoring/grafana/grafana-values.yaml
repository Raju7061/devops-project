# =============================================================================
# Grafana Values - Minikube Environment
# Project: Todo CDC Platform
# Environment: Minikube
# Grafana 11.x
# =============================================================================

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: grafana/grafana
  tag: "11.2.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels:
  app: grafana
  component: monitoring
  environment: minikube

# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# -----------------------------------------------------------------------------
# Admin Credentials
# -----------------------------------------------------------------------------
admin:
  user: admin
  password: admin123

# -----------------------------------------------------------------------------
# Grafana Configuration
# -----------------------------------------------------------------------------
grafana.ini:
  server:
    domain: grafana.local
    root_url: http://grafana.local
    serve_from_sub_path: false

  security:
    admin_user: admin
    admin_password: admin123
    allow_embedding: true

  users:
    allow_sign_up: false
    auto_assign_org_role: Viewer

  auth.anonymous:
    enabled: false

  analytics:
    reporting_enabled: false
    check_for_updates: false

  log:
    mode: console
    level: info

  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/home.json

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env:
  GF_EXPLORE_ENABLED: "true"
  GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/home.json

# -----------------------------------------------------------------------------
# Persistence
# -----------------------------------------------------------------------------
persistence:
  enabled: true

  type: pvc

  storageClassName: standard

  accessModes:
    - ReadWriteOnce

  size: 5Gi

  finalizers:
    - kubernetes.io/pvc-protection

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 512Mi

# -----------------------------------------------------------------------------
# Health Checks
# -----------------------------------------------------------------------------
livenessProbe:
  enabled: true

  httpGet:
    path: /api/health
    port: 3000

  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5

readinessProbe:
  enabled: true

  httpGet:
    path: /api/health
    port: 3000

  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

startupProbe:
  enabled: true

  httpGet:
    path: /api/health
    port: 3000

  failureThreshold: 30
  periodSeconds: 10

# -----------------------------------------------------------------------------
# Security Context
# -----------------------------------------------------------------------------
securityContext:
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472

containerSecurityContext:
  allowPrivilegeEscalation: false

# -----------------------------------------------------------------------------
# Scheduling
# -----------------------------------------------------------------------------
nodeSelector: {}

tolerations: []

affinity: {}

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: true

  ingressClassName: nginx

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

  hosts:
    - grafana.local

  path: /
  pathType: Prefix

  tls: []

# -----------------------------------------------------------------------------
# Prometheus Datasource
# -----------------------------------------------------------------------------
datasources:
  datasources.yaml:
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server:9090
        isDefault: true
        editable: true

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        editable: true

# -----------------------------------------------------------------------------
# Dashboard Providers
# -----------------------------------------------------------------------------
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1

    providers:
      - name: "todo-cdc-platform"
        orgId: 1
        folder: Todo CDC Platform
        type: file
        disableDeletion: false
        editable: true

        options:
          path: /var/lib/grafana/dashboards

# -----------------------------------------------------------------------------
# Dashboards Imported Automatically
# -----------------------------------------------------------------------------
dashboards:
  todo-cdc-platform:
    kubernetes-cluster:
      gnetId: 15757
      revision: 36
      datasource: Prometheus

    node-exporter:
      gnetId: 1860
      revision: 37
      datasource: Prometheus

    postgres:
      gnetId: 9628
      revision: 7
      datasource: Prometheus

    kafka:
      gnetId: 7589
      revision: 5
      datasource: Prometheus

    elasticsearch:
      gnetId: 14191
      revision: 1
      datasource: Prometheus

# -----------------------------------------------------------------------------
# Sidecars (Auto Discovery)
# -----------------------------------------------------------------------------
sidecar:
  dashboards:
    enabled: true

    label: grafana_dashboard

    searchNamespace: ALL

  datasources:
    enabled: true

    label: grafana_datasource

    searchNamespace: ALL

# -----------------------------------------------------------------------------
# Plugins Installed Automatically
# -----------------------------------------------------------------------------
plugins:
  - grafana-piechart-panel
  - grafana-clock-panel
  - grafana-worldmap-panel
  - grafana-polystat-panel
  - grafana-kubernetes-app

# -----------------------------------------------------------------------------
# Service Monitor
# -----------------------------------------------------------------------------
serviceMonitor:
  enabled: true

  interval: 30s

# -----------------------------------------------------------------------------
# SMTP (Disabled in Minikube)
# -----------------------------------------------------------------------------
smtp:
  enabled: false

# -----------------------------------------------------------------------------
# Alerting
# -----------------------------------------------------------------------------
alerting:
  enabled: true

  contactPoints:
    - name: default-email
      type: email
      settings:
        addresses: devops@example.com

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: info