# =============================================================================
# Prometheus Values - Minikube Environment
# Project: Todo CDC Platform
# Helm Chart: kube-prometheus-stack
# =============================================================================

fullnameOverride: prometheus

namespaceOverride: monitoring

# -----------------------------------------------------------------------------
# Global Settings
# -----------------------------------------------------------------------------
global:
  rbac:
    create: true

# -----------------------------------------------------------------------------
# Prometheus
# -----------------------------------------------------------------------------
prometheus:
  enabled: true

  service:
    type: ClusterIP
    port: 9090

  ingress:
    enabled: true
    ingressClassName: nginx

    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/ssl-redirect: "false"

    hosts:
      - prometheus.local

    paths:
      - /

    pathType: Prefix

    tls: []

  prometheusSpec:
    replicas: 1

    retention: 15d

    retentionSize: 8GB

    scrapeInterval: 30s

    evaluationInterval: 30s

    externalLabels:
      cluster: minikube
      environment: minikube
      project: todo-cdc-platform

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    enableAdminAPI: true

    walCompression: true

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard

          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 250m
        memory: 512Mi

      limits:
        cpu: "1"
        memory: 1Gi

    securityContext:
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534

# -----------------------------------------------------------------------------
# Alertmanager
# -----------------------------------------------------------------------------
alertmanager:
  enabled: true

  service:
    type: ClusterIP
    port: 9093

  ingress:
    enabled: true
    ingressClassName: nginx

    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/ssl-redirect: "false"

    hosts:
      - alertmanager.local

    paths:
      - /

    pathType: Prefix

    tls: []

  alertmanagerSpec:
    replicas: 1

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard

          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 2Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi

      limits:
        cpu: 300m
        memory: 256Mi

# -----------------------------------------------------------------------------
# Grafana (Disabled here because deployed separately)
# -----------------------------------------------------------------------------
grafana:
  enabled: false

# -----------------------------------------------------------------------------
# kube-state-metrics
# -----------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true

# -----------------------------------------------------------------------------
# Node Exporter
# -----------------------------------------------------------------------------
prometheus-node-exporter:
  enabled: true

# -----------------------------------------------------------------------------
# Kubernetes Components
# -----------------------------------------------------------------------------
kubeApiServer:
  enabled: true

kubelet:
  enabled: true

kubeControllerManager:
  enabled: true

coreDns:
  enabled: true

kubeScheduler:
  enabled: true

kubeProxy:
  enabled: true

kubeEtcd:
  enabled: false

# -----------------------------------------------------------------------------
# Prometheus Operator
# -----------------------------------------------------------------------------
prometheusOperator:
  enabled: true

  admissionWebhooks:
    enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi

# -----------------------------------------------------------------------------
# Service Monitors
# -----------------------------------------------------------------------------
additionalServiceMonitors:

  # Backend API
  - name: backend
    namespaceSelector:
      matchNames:
        - raju

    selector:
      matchLabels:
        app: backend

    endpoints:
      - port: http
        path: /metrics
        interval: 30s

  # PostgreSQL Exporter
  - name: postgres
    namespaceSelector:
      matchNames:
        - raju

    selector:
      matchLabels:
        app: postgres-exporter

    endpoints:
      - port: metrics
        interval: 30s

  # Kafka Exporter
  - name: kafka
    namespaceSelector:
      matchNames:
        - raju

    selector:
      matchLabels:
        app: kafka-exporter

    endpoints:
      - port: metrics
        interval: 30s

  # Debezium Connect Metrics
  - name: debezium
    namespaceSelector:
      matchNames:
        - raju

    selector:
      matchLabels:
        app: debezium

    endpoints:
      - port: metrics
        path: /metrics
        interval: 30s

  # Elasticsearch Exporter
  - name: elasticsearch
    namespaceSelector:
      matchNames:
        - raju

    selector:
      matchLabels:
        app: elasticsearch-exporter

    endpoints:
      - port: metrics
        interval: 30s

# -----------------------------------------------------------------------------
# Pod Monitors
# -----------------------------------------------------------------------------
additionalPodMonitors:

  - name: backend-pods
    namespaceSelector:
      matchNames:
        - raju

    selector:
      matchLabels:
        app: backend

    podMetricsEndpoints:
      - port: http
        path: /metrics
        interval: 30s

# -----------------------------------------------------------------------------
# Prometheus Rules
# -----------------------------------------------------------------------------
additionalPrometheusRulesMap:

  todo-platform-alerts:
    groups:
      - name: todo-platform.rules

        rules:

          - alert: BackendDown
            expr: up{job="backend"} == 0
            for: 1m

            labels:
              severity: critical

            annotations:
              summary: Backend API is down.

          - alert: KafkaDown
            expr: up{job="kafka"} == 0
            for: 2m

            labels:
              severity: critical

            annotations:
              summary: Kafka broker is down.

          - alert: DebeziumConnectorDown
            expr: up{job="debezium"} == 0
            for: 2m

            labels:
              severity: warning

            annotations:
              summary: Debezium connector is unavailable.

          - alert: PostgreSQLDown
            expr: up{job="postgres"} == 0
            for: 2m

            labels:
              severity: critical

            annotations:
              summary: PostgreSQL exporter is unavailable.

          - alert: ElasticsearchDown
            expr: up{job="elasticsearch"} == 0
            for: 2m

            labels:
              severity: critical

            annotations:
              summary: Elasticsearch exporter is unavailable.

          - alert: HighCPUUsage
            expr: |
              100 - (avg by(instance)(
                rate(node_cpu_seconds_total{mode="idle"}[5m])
              ) * 100) > 85

            for: 5m

            labels:
              severity: warning

            annotations:
              summary: High CPU usage detected.

          - alert: HighMemoryUsage
            expr: |
              (node_memory_MemAvailable_bytes /
               node_memory_MemTotal_bytes) < 0.15

            for: 5m

            labels:
              severity: warning

            annotations:
              summary: Node memory usage above 85%.

# -----------------------------------------------------------------------------
# Thanos (Disabled)
# -----------------------------------------------------------------------------
thanosRuler:
  enabled: false

# -----------------------------------------------------------------------------
# Default Rules
# -----------------------------------------------------------------------------
defaultRules:
  create: true

  rules:
    alertmanager: true
    etcd: false
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubePrometheusGeneral: true
    kubeScheduler: true
    kubeStateMetrics: true
    kubelet: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# -----------------------------------------------------------------------------
# Network Policy
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: false

# -----------------------------------------------------------------------------
# Security Context
# -----------------------------------------------------------------------------
securityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

# -----------------------------------------------------------------------------
# Scheduling
# -----------------------------------------------------------------------------
nodeSelector: {}

tolerations: []

affinity: {}