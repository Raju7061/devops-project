apiVersion: v1
kind: Namespace
metadata:
  name: raju
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: raju-stack
  namespace: raju
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/raju-stack
      sourceRef:
        kind: GitRepository
        name: devops-project
        namespace: flux-system
      reconcileStrategy: Revision
  # Safety: Wait for all pods to be healthy before marking release succeeded
  timeout: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 2
      rollback:
        cleanupOnFail: true
  values:
    # Set the global release metadata and lock image tags
    global:
      releaseTag: "v26.100.1"
    backend:
      image:
        tag: "v1.0.0"
    frontend:
      image:
        tag: "v1.0.0"
    consumer:
      image:
        tag: "v1.0.0"