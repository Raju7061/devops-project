apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cdc-platform
  namespace: cdc-todo-app
spec:
  interval: 5m
  chart:
    spec:
      #chart: ./apps/base/cdc-platform
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  values:
    persistence:
      postgresSize: 2Gi
      kafkaSize: 2Gi
      elasticsearchSize: 2Gi
