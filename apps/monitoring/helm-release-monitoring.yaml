apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: cdc-todo-app
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "58.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  values:
    alertmanager:
      config:
        global:
          resolve_timeout: 5m
          slack_api_url: 'https://hooks.slack.com/services/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'
        route:
          group_by: ['alertname', 'consumergroup', 'topic']
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1h
          receiver: 'slack-notifications'
        receivers:
          - name: 'slack-notifications'
            slack_configs:
              - channel: '#all-devops-alerts'
                send_resolved: true
                title: '🚨 [{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
                text: >-
                  *Details:* {{ .CommonAnnotations.description }}
                  *Severity:* `{{ .CommonLabels.severity }}`
                  *Consumer Group:* `{{ .CommonLabels.consumergroup }}`
                  *Topic:* `{{ .CommonLabels.topic }}`
    prometheus:
      prometheusSpec:
        additionalAlertRules:
          - name: kafka_cdc_alerts
            rules:
              - alert: KafkaConsumerLagHigh
                expr: sum by (consumergroup, topic) (kafka_consumergroup_lag_sum or kafka_consumergroup_lag) >= 5000
                for: 10s
                labels:
                  severity: critical
                annotations:
                  summary: "High Kafka Consumer Lag detected: {{ $labels.consumergroup }}"
                  description: "Consumer group '{{ $labels.consumergroup }}' has lag >= 5000 messages."
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-kafka-exporter
  namespace: cdc-todo-app
spec:
  interval: 15m
  chart:
    spec:
      chart: prometheus-kafka-exporter
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    kafkaServer:
      - kafka.cdc-todo-app.svc.cluster.local:9092