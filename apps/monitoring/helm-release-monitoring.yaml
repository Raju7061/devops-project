apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: cdc-todo-app
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "58.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # 1. Global Alertmanager & Slack Notification Channel
    alertmanager:
      config:
        global:
          resolve_timeout: 5m
          slack_api_url: 'https://hooks.slack.com/services/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'
        route:
          group_by: ['alertname', 'namespace']
          group_wait: 10s
          group_interval: 30s
          repeat_interval: 1h
          receiver: 'slack-notifications'
        receivers:
          - name: 'slack-notifications'
            slack_configs:
              - channel: '#all-devops-alerts'
                send_resolved: true
                title: '🚨 [{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
                text: >-
                  *Alert:* {{ .CommonAnnotations.summary }}
                  *Details:* {{ .CommonAnnotations.description }}
                  *Severity:* `{{ .CommonLabels.severity }}`
                  *Namespace:* `{{ .CommonLabels.namespace }}`

    # 2. Prometheus Spec with Native Kubernetes Scrape Discovery
    prometheus:
      prometheusSpec:
        scrapeInterval: "5s"
        evaluationInterval: "5s"
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        additionalScrapeConfigs:
          - job_name: 'kafka-exporter'
            static_configs:
              - targets: ['prometheus-kafka-exporter.cdc-todo-app.svc.cluster.local:9308']

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-kafka-exporter
  namespace: cdc-todo-app
spec:
  interval: 15m
  chart:
    spec:
      chart: prometheus-kafka-exporter
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    kafkaServer:
      - kafka.cdc-todo-app.svc.cluster.local:9092
