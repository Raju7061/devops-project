apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: cdc-todo-app
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "58.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  values:
    alertmanager:
      config:
        global:
          resolve_timeout: 5m
          slack_api_url: 'https://hooks.slack.com/services/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'
        route:
          group_by: ['alertname', 'consumergroup', 'topic']
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1h
          receiver: 'slack-notifications'
        receivers:
          - name: 'slack-notifications'
            slack_configs:
              - channel: '#all-devops-alerts'
                send_resolved: true
                title: '🚨 [{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
                text: >-
                  *Details:* {{ .CommonAnnotations.description }}
                  *Severity:* `{{ .CommonLabels.severity }}`
                  *Consumer Group:* `{{ .CommonLabels.consumergroup }}`
                  *Topic:* `{{ .CommonLabels.topic }}`

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-kafka-exporter
  namespace: cdc-todo-app
spec:
  interval: 15m
  chart:
    spec:
      chart: prometheus-kafka-exporter
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    kafkaServer:
      - kafka.cdc-todo-app.svc.cluster.local:9092
    serviceMonitor:
      enabled: true
      namespace: cdc-todo-app
      interval: 15s
      scrapeTimeout: 10s
      additionalLabels:
        release: kube-prometheus-stack