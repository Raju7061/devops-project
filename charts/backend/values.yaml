# =============================================================================
# Backend Helm Chart - Default Values
# Project: Todo CDC Platform
# =============================================================================

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: 2024dock/cdc-backend
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels:
  app: backend
  component: api

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: false

# -----------------------------------------------------------------------------
# Backend Environment Configuration
# -----------------------------------------------------------------------------

config:
  NODE_ENV: development
  PORT: "8080"
  LOG_LEVEL: info
  API_PREFIX: /api

  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: tododb

  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: todo.public.todos

  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_INDEX: todos

secret:
  POSTGRES_USER: todo_user
  POSTGRES_PASSWORD: todo_password

envFromConfigMap: true
envFromSecret: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -----------------------------------------------------------------------------
# Health Checks
# -----------------------------------------------------------------------------

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
