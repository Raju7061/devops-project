# =============================================================================
# Kafka Values
# Todo CDC Platform
# =============================================================================

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: bitnami/kafka
  tag: "3.8.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels:
  app: kafka
  component: broker

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 9092
  targetPort: 9092

config:
  KAFKA_CFG_NODE_ID: "1"
  KAFKA_CFG_PROCESS_ROLES: "broker,controller"
  KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

  KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
  KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://raju-stack-kafka:9092"

  KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

  KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@raju-stack-kafka:9093"

  KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_CFG_NUM_PARTITIONS: "1"
  KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
  KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

startupProbe:
  enabled: true
  tcpSocket:
    port: 9092
  failureThreshold: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  tcpSocket:
    port: 9092
  initialDelaySeconds: 20
  periodSeconds: 10

livenessProbe:
  enabled: true
  tcpSocket:
    port: 9092
  initialDelaySeconds: 30
  periodSeconds: 15

autoscaling:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}