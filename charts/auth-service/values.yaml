replicaCount: 1

image:
  repository: 2024dock/cdc-auth
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 8090
  targetPort: 8090

config:
  POSTGRES_HOST: raju-stack-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: tododb
  POSTGRES_USER: todo_user

secret:
  POSTGRES_PASSWORD: todo_password
  JWT_SECRET: ""

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 256Mi
