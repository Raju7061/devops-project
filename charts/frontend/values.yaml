# =============================================================================
# Frontend Helm Chart Values
# Todo CDC Platform
# =============================================================================

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: 2024dock/cdc-frontend
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels:
  app: frontend
  component: ui

podSecurityContext:
  fsGroup: 101

securityContext:
  runAsUser: 101
  runAsGroup: 101

containerSecurityContext:
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

  hosts:
    - host: todo.local
      paths:
        - path: /
          pathType: Prefix

  tls: []

config:
  NODE_ENV: development

  REACT_APP_API_URL: http://backend:8080/api

  REACT_APP_ELASTICSEARCH_URL: http://elasticsearch:9200

  REACT_APP_KIBANA_URL: http://kibana:5601

secret: {}

envFromConfigMap: true
envFromSecret: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

startupProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 10
  failureThreshold: 30

autoscaling:
  enabled: false

nodeSelector: {}
affinity: {}
tolerations: []
volumes: []
volumeMounts: []