apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "frontend.fullname" . }}-config
  labels:
    {{- include "frontend.labels" . | nindent 4 }}

data:
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}
  REACT_APP_API_URL: {{ .Values.config.REACT_APP_API_URL | quote }}
  REACT_APP_ELASTICSEARCH_URL: {{ .Values.config.REACT_APP_ELASTICSEARCH_URL | quote }}
  REACT_APP_KIBANA_URL: {{ .Values.config.REACT_APP_KIBANA_URL | quote }}