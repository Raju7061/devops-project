replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: postgres
  tag: "16.4"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

securityContext:
  fsGroup: 999

containerSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 5432
  targetPort: 5432

auth:
  database: tododb
  username: todo_user
  password: todo_password

persistence:
  enabled: true
  storageClass: standard
  accessMode: ReadWriteOnce
  size: 5Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

postgresql:
  maxConnections: "200"
  walLevel: logical
  maxWalSenders: "10"
  maxReplicationSlots: "10"

livenessProbe:
  tcpSocket:
    port: 5432
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  exec:
    command:
      - sh
      - -c
      - pg_isready -U todo_user -d tododb
  initialDelaySeconds: 10
  periodSeconds: 5

startupProbe:
  tcpSocket:
    port: 5432
  failureThreshold: 30
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}