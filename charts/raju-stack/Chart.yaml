apiVersion: v2
name: raju-stack
version: 26.100.22
appVersion: v26.100.22
dependencies:
  - name: auth-service
    repository: file://../auth-service
    version: 0.1.0
  - name: backend
    repository: file://../backend
    version: 0.1.0
  - name: frontend
    repository: file://../frontend
    version: 0.1.0
  - name: consumer
    repository: file://../consumer
    version: 0.1.0
  - name: postgres
    repository: "file://../postgres"
    version: "0.1.0"
  - name: debezium
    repository: "file://../debezium"
    version: "0.1.0"
  - name: kafka
    repository: "file://../kafka"
    version: "0.1.0"
  - name: elasticsearch
    repository: "file://../elasticsearch"
    version: "0.1.0"
    condition: elasticsearch.enabled
  - name: kibana
    repository: "file://../kibana"
    version: "0.1.0"
    condition: kibana.enabled
  - name: kowl
    repository: "file://../kowl"
    version: "0.1.0"
    condition: kowl.enabled
