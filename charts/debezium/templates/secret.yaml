apiVersion: v1
kind: Secret

metadata:
  name: {{ include "debezium.fullname" . }}-secret
  labels:
    {{- include "debezium.labels" . | nindent 4 }}

type: Opaque

stringData:
  POSTGRES_USER: {{ index .Values.connector.config "database.user" | quote }}
  POSTGRES_PASSWORD: {{ index .Values.connector.config "database.password" | quote }}
  POSTGRES_DB: {{ index .Values.connector.config "database.dbname" | quote }}