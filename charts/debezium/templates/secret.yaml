apiVersion: v1
kind: Secret

metadata:
  name: {{ include "debezium.fullname" . }}-secret

type: Opaque

stringData:
  POSTGRES_USER: {{ .Values.connector.config.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.connector.config.database.password | quote }}
  POSTGRES_DB: {{ .Values.connector.config.database.dbname | quote }}