apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "debezium.fullname" . }}
  labels:
    {{- include "debezium.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "debezium.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "debezium.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      serviceAccountName: {{ include "debezium.serviceAccountName" . }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}

      initContainers:
        - name: configure-connect-topics
          image: "{{ .Values.kafkaAdmin.image.repository }}:{{ .Values.kafkaAdmin.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xms64m -Xmx256m"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafkaAdmin.bootstrapServers | quote }}
            - name: CONFIG_STORAGE_TOPIC
              value: {{ .Values.config.CONFIG_STORAGE_TOPIC | quote }}
            - name: OFFSET_STORAGE_TOPIC
              value: {{ .Values.config.OFFSET_STORAGE_TOPIC | quote }}
            - name: STATUS_STORAGE_TOPIC
              value: {{ .Values.config.STATUS_STORAGE_TOPIC | quote }}
          command:
            - /bin/bash
            - -ec
          args:
            - |
              kafka_topics=/opt/bitnami/kafka/bin/kafka-topics.sh
              kafka_configs=/opt/bitnami/kafka/bin/kafka-configs.sh

              until "$kafka_topics" --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" --list >/dev/null 2>&1; do
                echo "Waiting for Kafka at $KAFKA_BOOTSTRAP_SERVERS"
                sleep 5
              done

              for topic in "$CONFIG_STORAGE_TOPIC" "$OFFSET_STORAGE_TOPIC" "$STATUS_STORAGE_TOPIC"; do
                "$kafka_topics" --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" \
                  --create --if-not-exists --topic "$topic" \
                  --partitions 1 --replication-factor 1 \
                  --config cleanup.policy=compact
                "$kafka_configs" --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" \
                  --entity-type topics --entity-name "$topic" \
                  --alter --add-config cleanup.policy=compact
              done

      containers:
        - name: debezium

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          # -------------------------------------------------------------------
          # Kafka Connect Environment
          # -------------------------------------------------------------------
          envFrom:
            - configMapRef:
                name: {{ include "debezium.fullname" . }}-config

            - secretRef:
                name: {{ include "debezium.fullname" . }}-secret

          # -------------------------------------------------------------------
          # Resources
          # -------------------------------------------------------------------
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # -------------------------------------------------------------------
          # Startup Probe
          # -------------------------------------------------------------------
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.httpGet.path }}
              port: {{ .Values.startupProbe.httpGet.port }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}

          # -------------------------------------------------------------------
          # Readiness Probe
          # -------------------------------------------------------------------
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}

          # -------------------------------------------------------------------
          # Liveness Probe
          # -------------------------------------------------------------------
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}

      # -------------------------------------------------------------------------
      # Scheduling
      # -------------------------------------------------------------------------
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}