apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "debezium.fullname" . }}
  labels:
    {{- include "debezium.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "debezium.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "debezium.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      serviceAccountName: {{ include "debezium.serviceAccountName" . }}

      securityContext:
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}

      containers:
        - name: debezium

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          ports:
            - name: http
              containerPort: 8083
              protocol: TCP

          env:
            - name: BOOTSTRAP_SERVERS
              value: {{ .Values.env.BOOTSTRAP_SERVERS | quote }}

            - name: GROUP_ID
              value: {{ .Values.env.GROUP_ID | quote }}

            - name: CONFIG_STORAGE_TOPIC
              value: {{ .Values.env.CONFIG_STORAGE_TOPIC | quote }}

            - name: OFFSET_STORAGE_TOPIC
              value: {{ .Values.env.OFFSET_STORAGE_TOPIC | quote }}

            - name: STATUS_STORAGE_TOPIC
              value: {{ .Values.env.STATUS_STORAGE_TOPIC | quote }}

            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.env.CONFIG_STORAGE_REPLICATION_FACTOR | quote }}

            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.env.OFFSET_STORAGE_REPLICATION_FACTOR | quote }}

            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.env.STATUS_STORAGE_REPLICATION_FACTOR | quote }}

            - name: KEY_CONVERTER
              value: {{ .Values.env.KEY_CONVERTER | quote }}

            - name: VALUE_CONVERTER
              value: {{ .Values.env.VALUE_CONVERTER | quote }}

            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: {{ .Values.env.KEY_CONVERTER_SCHEMAS_ENABLE | quote }}

            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: {{ .Values.env.VALUE_CONVERTER_SCHEMAS_ENABLE | quote }}

            - name: REST_ADVERTISED_HOST_NAME
              value: {{ .Values.env.REST_ADVERTISED_HOST_NAME | quote }}

            - name: REST_PORT
              value: {{ .Values.env.REST_PORT | quote }}

            - name: PLUGIN_PATH
              value: {{ .Values.env.PLUGIN_PATH | quote }}

            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /connectors
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}