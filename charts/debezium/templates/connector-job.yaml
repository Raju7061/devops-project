{{- if .Values.connector.enabled }}
apiVersion: batch/v1
kind: Job

metadata:
  name: {{ include "debezium.fullname" . }}-connector
  labels:
    {{- include "debezium.labels" . | nindent 4 }}

spec:
  backoffLimit: 10

  template:
    metadata:
      labels:
        {{- include "debezium.selectorLabels" . | nindent 8 }}

    spec:
      restartPolicy: OnFailure

      containers:
        - name: register-connector

          image: curlimages/curl:8.10.1

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -e

              echo "Waiting for Debezium..."

              for i in $(seq 1 {{ .Values.autoRegisterConnector.retryCount }}); do

                if curl -fsS http://{{ include "debezium.fullname" . }}:{{ .Values.service.port }}/ > /dev/null 2>&1; then
                  echo "Debezium is ready"
                  break
                fi

                echo "Debezium not ready. Attempt $i/{{ .Values.autoRegisterConnector.retryCount }}"

                sleep {{ .Values.autoRegisterConnector.retryIntervalSeconds }}

              done

              echo "Checking connector..."

              if curl -fsS \
                http://{{ include "debezium.fullname" . }}:{{ .Values.service.port }}/connectors/{{ .Values.connector.name }} \
                > /dev/null 2>&1; then

                echo "Connector {{ .Values.connector.name }} already exists"

                exit 0
              fi

              echo "Registering connector..."

              cat > /tmp/connector.json <<'EOF'
              {
                "name": {{ .Values.connector.name | toJson }},
                "config": {{ toJson .Values.connector.config }}
              }
              EOF

              curl -fsS \
                -X POST \
                -H "Content-Type: application/json" \
                --data @/tmp/connector.json \
                http://{{ include "debezium.fullname" . }}:{{ .Values.service.port }}/connectors

              echo
              echo "Connector registration completed."

{{- end }}