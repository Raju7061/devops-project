# =============================================================================
# Consumer Helm Chart Values
# Todo CDC Platform
# =============================================================================

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: 2024dock/cdc-consumer
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels:
  app: consumer
  component: kafka-consumer

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false

config:
  NODE_ENV: development

  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: todo.public.todos

  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_INDEX: todos

  GROUP_ID: todo-consumer-group

secret: {}

envFromConfigMap: true
envFromSecret: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  exec:
    command:
      - sh
      - -c
      - ps aux | grep node
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  exec:
    command:
      - sh
      - -c
      - ps aux | grep node
  initialDelaySeconds: 5
  periodSeconds: 5

startupProbe:
  exec:
    command:
      - sh
      - -c
      - ps aux | grep node
  periodSeconds: 10
  failureThreshold: 30

autoscaling:
  enabled: false

nodeSelector: {}
affinity: {}
tolerations: []
volumes: []
volumeMounts: []