name: CI-CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'docker-setup/frontend/**'
      - 'docker-setup/backend/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'docker-setup/frontend/**'
            backend:
              - 'docker-setup/backend/**'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calculate Release & Image Versions
        id: versions
        run: |
          # 1. Calculate Git release tag (e.g., v26.100.1 -> v26.100.2)
          LATEST_TAG=$(git tag -l "v26.100.*" | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v26.100.1"
            PATCH_NUM=1
          else
            PATCH_NUM=$(echo "$LATEST_TAG" | awk -F. '{print $3}')
            PATCH_NUM=$((PATCH_NUM + 1))
            NEW_TAG="v26.100.$PATCH_NUM"
          fi
          echo "RELEASE_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "PATCH_NUM=$PATCH_NUM" >> $GITHUB_OUTPUT
          echo "Calculated Release Tag: $NEW_TAG"

          # 2. Derive individual image version from the release increment
          IMAGE_TAG="v1.0.${PATCH_NUM}-amd64"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Calculated Image Tag: $IMAGE_TAG"

      # --- FRONTEND BUILD ---
      - name: Build & Push Frontend Image
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./docker-setup/frontend
          file: ./docker-setup/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: 2024dock/cdc-frontend:${{ steps.versions.outputs.IMAGE_TAG }}

      # --- BACKEND BUILD ---
      - name: Build & Push Backend Image
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./docker-setup/backend
          file: ./docker-setup/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: 2024dock/cdc-backend:${{ steps.versions.outputs.IMAGE_TAG }}

      # --- UPDATE VALUES.YAML & GIT TAG ---
      - name: Update values.yaml and Push Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          VALUES_FILE="apps/base/cdc-platform/values.yaml"
          IMG_TAG="${{ steps.versions.outputs.IMAGE_TAG }}"
          NEW_RELEASE_TAG="${{ steps.versions.outputs.RELEASE_TAG }}"

          # Update frontend in values.yaml if changed
          if [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then
            sed -i "s|frontend:.*|frontend: 2024dock/cdc-frontend:$IMG_TAG|g" $VALUES_FILE
          fi

          # Update backend in values.yaml if changed
          if [ "${{ steps.filter.outputs.backend }}" = "true" ]; then
            sed -i "s|backend:.*|backend: 2024dock/cdc-backend:$IMG_TAG|g" $VALUES_FILE
          fi

          # Update Chart.yaml version/appVersion to match the release tag
          sed -i "s|^version:.*|version: $NEW_RELEASE_TAG|g" apps/base/cdc-platform/Chart.yaml
          sed -i "s|^appVersion:.*|appVersion: \"$NEW_RELEASE_TAG\"|g" apps/base/cdc-platform/Chart.yaml

          # Commit updated files back to main
          git add $VALUES_FILE apps/base/cdc-platform/Chart.yaml
          git commit -m "chore(release): bump images to $IMG_TAG and chart to $NEW_RELEASE_TAG [skip ci]" || echo "No changes to commit"
          git push origin main

          # Create and push the Git tag
          git tag "$NEW_RELEASE_TAG"
          git push origin "$NEW_RELEASE_TAG"
