name: Build, Push Images and Create Tag

on:
  push:
    branches:
      - main
    paths:
      - 'docker-setup/backend/**'
      - 'docker-setup/frontend/**'

jobs:
  detect-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'docker-setup/frontend/**'
            backend:
              - 'docker-setup/backend/**'

      - name: Calculate Next Release and Image Tag
        id: get_ver
        run: |
          git fetch --tags

          LATEST_TAG=$(git tag -l "v26.100.*" | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            PATCH_NUM=1
          else
            PATCH_NUM=$(echo $LATEST_TAG | awk -F. '{print $3}')
            PATCH_NUM=$((PATCH_NUM + 1))
          fi

          NEXT_RELEASE_TAG="v26.100.${PATCH_NUM}"
          IMAGE_TAG="v1.0.${PATCH_NUM}-amd64"

          echo "NEXT_RELEASE_TAG=$NEXT_RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "FRONTEND_CHANGED=${{ steps.filter.outputs.frontend }}" >> $GITHUB_OUTPUT
          echo "BACKEND_CHANGED=${{ steps.filter.outputs.backend }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and Push FRONTEND ONLY if frontend changed
      - name: Build & Push Frontend
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./docker-setup/frontend
          file: ./docker-setup/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: 2024dock/cdc-frontend:${{ steps.get_ver.outputs.IMAGE_TAG }}

      # Build and Push BACKEND ONLY if backend changed
      - name: Build & Push Backend
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./docker-setup/backend
          file: ./docker-setup/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: 2024dock/cdc-backend:${{ steps.get_ver.outputs.IMAGE_TAG }}

      # Update release.yaml so we know WHICH service was built with this tag
      - name: Update release metadata
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cat << EOF > release.yaml
          release:
            version: "${{ steps.get_ver.outputs.NEXT_RELEASE_TAG }}"
            imageTag: "${{ steps.get_ver.outputs.IMAGE_TAG }}"
            updatedService:
              frontend: ${{ steps.filter.outputs.frontend }}
              backend: ${{ steps.filter.outputs.backend }}
          EOF

          git add release.yaml
          git commit -m "chore: record built images for ${{ steps.get_ver.outputs.NEXT_RELEASE_TAG }} [skip ci]"

          # Create & Push Tag
          git tag ${{ steps.get_ver.outputs.NEXT_RELEASE_TAG }}
          git push origin main
          git push origin ${{ steps.get_ver.outputs.NEXT_RELEASE_TAG }}
