name: Release Promotion to Helm

on:
  workflow_dispatch:
  # Ya jab aap release trigger karte hain

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Selectively Update Chart and Values
        run: |
          # Read metadata from release.yaml
          REL_VERSION=$(grep 'version:' release.yaml | awk '{print $2}' | tr -d '"')
          NEW_TAG=$(grep 'imageTag:' release.yaml | awk '{print $2}' | tr -d '"')
          FRONTEND_UPDATE=$(grep 'frontend:' release.yaml | awk '{print $2}')
          BACKEND_UPDATE=$(grep 'backend:' release.yaml | awk '{print $2}')

          echo "Promoting Release: $REL_VERSION, Target Image Tag: $NEW_TAG"

          # Update Chart.yaml
          sed -i "s/^version:.*/version: ${REL_VERSION}/" apps/base/cdc-platform/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${REL_VERSION}\"/" apps/base/cdc-platform/Chart.yaml

          # Sirf tab update karo agar frontend sach me build hua tha
          if [ "$FRONTEND_UPDATE" = "true" ]; then
            echo "Updating frontend image to $NEW_TAG"
            sed -i "s|2024dock/cdc-frontend:.*|2024dock/cdc-frontend:${NEW_TAG}|g" apps/base/cdc-platform/values.yaml
          fi

          # Sirf tab update karo agar backend sach me build hua tha
          if [ "$BACKEND_UPDATE" = "true" ]; then
            echo "Updating backend image to $NEW_TAG"
            sed -i "s|2024dock/cdc-backend:.*|2024dock/cdc-backend:${NEW_TAG}|g" apps/base/cdc-platform/values.yaml
          fi

      - name: Commit to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add apps/base/cdc-platform/Chart.yaml apps/base/cdc-platform/values.yaml
          git commit -m "chore(deploy): promote $REL_VERSION [skip ci]" || echo "No changes to commit"
          git push origin main
