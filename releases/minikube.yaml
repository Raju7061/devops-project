# =============================================================================
# Todo CDC Platform - Minikube Release
# FluxCD HelmRelease
# Namespace: raju
# Environment: Minikube
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: raju
  labels:
    app.kubernetes.io/name: raju-stack
    app.kubernetes.io/part-of: todo-cdc-platform
    app.kubernetes.io/environment: minikube

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: raju-stack
  namespace: raju
  labels:
    app.kubernetes.io/name: raju-stack
    app.kubernetes.io/environment: minikube

spec:
  interval: 2m
  releaseName: raju-stack
  timeout: 10m
  maxHistory: 10

  chart:
    spec:
      chart: ./charts/raju-stack
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
      interval: 5m

  install:
    createNamespace: true
    remediation:
      retries: 3
      remediateLastFailure: true

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
      strategy: rollback

  rollback:
    cleanupOnFail: true
    recreate: true

  uninstall:
    keepHistory: false
    deletionPropagation: background

  driftDetection:
    mode: enabled

  values:
    # =========================================================================
    # Global
    # =========================================================================
    global:
      releaseTag: "v26.100.13"
      environment: minikube
      namespace: raju

    # =========================================================================
    # Backend
    # =========================================================================
    backend:
      enabled: true
      replicaCount: 1

      image:
        repository: 2024dock/cdc-backend
        tag: "v1.0.12"

      service:
        type: ClusterIP
        port: 8080

    # =========================================================================
    # Frontend
    # =========================================================================
    frontend:
      enabled: true
      replicaCount: 1

      image:
        repository: 2024dock/cdc-frontend
        tag: "v1.0.13"

      service:
        type: ClusterIP
        port: 80

      ingress:
        enabled: true
        className: nginx
        hosts:
          - host: todo.local
            paths:
              - path: /
                pathType: Prefix

    # =========================================================================
    # Kafka Consumer
    # =========================================================================
    consumer:
      enabled: true
      replicaCount: 1

      image:
        repository: 2024dock/cdc-consumer
        tag: "v1.0.3"

    # =========================================================================
    # PostgreSQL
    # =========================================================================
    postgres:
      enabled: true
      replicaCount: 1

      image:
        repository: postgres
        tag: "16.4"

      auth:
        database: tododb
        username: todo_user
        password: todo_password

      persistence:
        enabled: true
        storageClass: standard
        size: 5Gi

    # =========================================================================
    # Kafka
    # =========================================================================
    kafka:
      enabled: true
      replicaCount: 1

      image:
        repository: bitnami/kafka
        tag: "3.8.0"

      service:
        type: ClusterIP
        port: 9092
        targetPort: 9092

    # =========================================================================
    # Debezium
    # =========================================================================
  debezium:
    enabled: true
    replicaCount: 1

    image:
      repository: quay.io/debezium/connect
      tag: "3.2"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 8083
      targetPort: 8083

    config:
      BOOTSTRAP_SERVERS: "raju-stack-kafka:9092"
      GROUP_ID: "todo-connect-cluster"

      CONFIG_STORAGE_TOPIC: "connect-configs"
      OFFSET_STORAGE_TOPIC: "connect-offsets"
      STATUS_STORAGE_TOPIC: "connect-status"

      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"

      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      REST_ADVERTISED_HOST_NAME: "raju-stack-debezium"
      REST_PORT: "8083"

      PLUGIN_PATH: "/kafka/connect,/debezium/connectors"

      LOG_LEVEL: "INFO"

    connector:
      enabled: true

      name: "todo-postgres-connector"

      config:
        connector.class: "io.debezium.connector.postgresql.PostgresConnector"
        database.hostname: "raju-stack-postgres"
        database.port: "5432"
        database.user: "todo_user"
        database.password: "todo_password"
        database.dbname: "tododb"

        topic.prefix: "todo"

        plugin.name: "pgoutput"

        publication.name: "todo_publication"
        slot.name: "todo_debezium_slot"

        snapshot.mode: "initial"

        table.include.list: "public.todos"

        include.schema.changes: "false"

        heartbeat.interval.ms: "10000"

        tombstones.on.delete: "false"

        decimal.handling.mode: "string"
        time.precision.mode: "connect"

        key.converter: "org.apache.kafka.connect.json.JsonConverter"
        value.converter: "org.apache.kafka.connect.json.JsonConverter"

        key.converter.schemas.enable: "false"
        value.converter.schemas.enable: "false"

        transforms: "unwrap"
        transforms.unwrap.type: "io.debezium.transforms.ExtractNewRecordState"
        transforms.unwrap.drop.tombstones: "true"
        transforms.unwrap.delete.handling.mode: "rewrite"

    autoRegisterConnector:
      enabled: true
      retryCount: 30
      retryIntervalSeconds: 10

    # =========================================================================
    # Elasticsearch (Disabled)
    # =========================================================================
    elasticsearch:
      enabled: false

    # =========================================================================
    # Kibana (Disabled)
    # =========================================================================
    kibana:
      enabled: false

    # =========================================================================
    # Monitoring (Disabled)
    # =========================================================================
    monitoring:
      prometheus:
        enabled: false

      grafana:
        enabled: false