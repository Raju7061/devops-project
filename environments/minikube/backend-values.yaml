# -----------------------------------------------------------------------------
# Backend Values - Minikube Environment
# Project: Todo CDC Platform
# Environment: Minikube
# -----------------------------------------------------------------------------

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: 2024dock/cdc-backend
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels:
  app: backend
  component: api
  environment: minikube

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: nginx

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

  hosts:
    - host: api.todo.local
      paths:
        - path: /
          pathType: Prefix

  tls: []

config:
  NODE_ENV: development

  PORT: "8080"

  LOG_LEVEL: info

  API_PREFIX: /api

  # PostgreSQL
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: tododb

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: todo.public.todos

  # Elasticsearch
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_INDEX: todos

secret:
  POSTGRES_USER: todo_user
  POSTGRES_PASSWORD: todo_password

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: true

  httpGet:
    path: /health
    port: 8080

  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true

  httpGet:
    path: /ready
    port: 8080

  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  enabled: true

  httpGet:
    path: /health
    port: 8080

  failureThreshold: 30
  periodSeconds: 10

autoscaling:
  enabled: true

  minReplicas: 1
  maxReplicas: 3

  targetCPUUtilizationPercentage: 70

nodeSelector: {}

tolerations: []

affinity: {}

envFromConfigMap: true
envFromSecret: true

persistence:
  enabled: false

  storageClass: standard
  accessModes:
    - ReadWriteOnce

  size: 1Gi

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

terminationGracePeriodSeconds: 30