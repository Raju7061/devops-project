# -----------------------------------------------------------------------------
# Backend Values - Minikube Environment
# Project: Todo CDC Platform
# Environment: Minikube
# -----------------------------------------------------------------------------

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: 2024dock/cdc-backend
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels:
  app: backend
  component: api
  environment: minikube

# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# -----------------------------------------------------------------------------
# Ingress (disabled for backend)
# -----------------------------------------------------------------------------

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

# -----------------------------------------------------------------------------
# Application Configuration
# -----------------------------------------------------------------------------

config:
  NODE_ENV: development
  PORT: "8080"
  LOG_LEVEL: info
  API_PREFIX: /api

  # PostgreSQL (Helm service name)
  POSTGRES_HOST: raju-stack-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: tododb

  # Kafka (Helm service name)
  KAFKA_BOOTSTRAP_SERVERS: ""
  KAFKA_TOPIC: ""

  # Elasticsearch (Helm service name)
  ELASTICSEARCH_URL: ""
  ELASTICSEARCH_INDEX: ""

# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------

secret:
  POSTGRES_USER: todo_user
  POSTGRES_PASSWORD: todo_password

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -----------------------------------------------------------------------------
# Health Probes
# -----------------------------------------------------------------------------

startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  failureThreshold: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# -----------------------------------------------------------------------------
# Autoscaling
# -----------------------------------------------------------------------------

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------------
# Scheduling
# -----------------------------------------------------------------------------

nodeSelector: {}
tolerations: []
affinity: {}

# -----------------------------------------------------------------------------
# ConfigMap / Secret Injection
# -----------------------------------------------------------------------------

envFromConfigMap: true
envFromSecret: true

# -----------------------------------------------------------------------------
# Persistence
# -----------------------------------------------------------------------------

persistence:
  enabled: false
  storageClass: standard
  accessModes:
    - ReadWriteOnce
  size: 1Gi

# -----------------------------------------------------------------------------
# Security Context
# -----------------------------------------------------------------------------

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

terminationGracePeriodSeconds: 30
