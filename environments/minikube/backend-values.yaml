# -----------------------------------------------------------------------------
# Backend Values - Minikube Environment
# Project: Todo CDC Platform
# Environment: Minikube
# -----------------------------------------------------------------------------

replicaCount: 1
nameOverride: ""
fullnameOverride: ""
image:
  repository: 2024dock/cdc-backend
  tag: "v1.0.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels:
  app: backend
  component: api
  environment: minikube

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  NODE_ENV: development
  PORT: "8080"
  LOG_LEVEL: info
  API_PREFIX: /api
<
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

  enabled: true
  httpGet:
    path: /health
    port: 8080
