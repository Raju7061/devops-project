replicaCount: 1

image:
  repository: postgres
  tag: "16.4"

service:
  type: ClusterIP
  port: 5432

auth:
  database: tododb
  username: todo_user
  password: todo_password

persistence:
  enabled: true
  storageClass: standard
  size: 5Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi