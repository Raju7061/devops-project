# =============================================================================
# Todo CDC Platform
# Debezium Values (Minikube)
# PostgreSQL CDC -> Kafka
# =============================================================================

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Docker Image
# -----------------------------------------------------------------------------
image:
  repository: quay.io/debezium/connect
  tag: "3.2"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""

# -----------------------------------------------------------------------------
# Pod Metadata
# -----------------------------------------------------------------------------
podAnnotations: {}

podLabels:
  app: debezium
  component: kafka-connect
  environment: minikube

# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8083
  targetPort: 8083

# -----------------------------------------------------------------------------
# Kafka Connect Configuration
# -----------------------------------------------------------------------------
config:
  BOOTSTRAP_SERVERS: "raju-stack-kafka:9092"

  GROUP_ID: "todo-connect-cluster"

  CONFIG_STORAGE_TOPIC: "connect-configs"
  OFFSET_STORAGE_TOPIC: "connect-offsets"
  STATUS_STORAGE_TOPIC: "connect-status"

  CONFIG_STORAGE_REPLICATION_FACTOR: "1"
  OFFSET_STORAGE_REPLICATION_FACTOR: "1"
  STATUS_STORAGE_REPLICATION_FACTOR: "1"

  KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
  VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"

  KEY_CONVERTER_SCHEMAS_ENABLE: "false"
  VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

  REST_ADVERTISED_HOST_NAME: "raju-stack-debezium"
  REST_PORT: "8083"

  PLUGIN_PATH: "/kafka/connect,/debezium/connectors"

  LOG_LEVEL: "INFO"

# -----------------------------------------------------------------------------
# PostgreSQL CDC Connector
# -----------------------------------------------------------------------------
connector:
  enabled: true

  name: "todo-postgres-connector"

  config:
    connector.class: "io.debezium.connector.postgresql.PostgresConnector"

    database.hostname: "raju-stack-postgres"
    database.port: "5432"

    database.user: "todo_user"
    database.password: "todo_password"
    database.dbname: "tododb"

    topic.prefix: "todo"

    plugin.name: "pgoutput"

    publication.name: "todo_publication"
    slot.name: "todo_debezium_slot"

    snapshot.mode: "initial"

    table.include.list: "public.todos"

    include.schema.changes: "false"

    heartbeat.interval.ms: "10000"

    tombstones.on.delete: "false"

    decimal.handling.mode: "string"
    time.precision.mode: "connect"

    key.converter: "org.apache.kafka.connect.json.JsonConverter"
    value.converter: "org.apache.kafka.connect.json.JsonConverter"

    key.converter.schemas.enable: "false"
    value.converter.schemas.enable: "false"

    transforms: "unwrap"
    transforms.unwrap.type: "io.debezium.transforms.ExtractNewRecordState"
    transforms.unwrap.drop.tombstones: "true"
    transforms.unwrap.delete.handling.mode: "rewrite"

# -----------------------------------------------------------------------------
# Auto Register Connector
# -----------------------------------------------------------------------------
autoRegisterConnector:
  enabled: true
  retryCount: 30
  retryIntervalSeconds: 10

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 250m
    memory: 512Mi

  limits:
    cpu: "1"
    memory: 1Gi

# -----------------------------------------------------------------------------
# Health Probes
# -----------------------------------------------------------------------------
startupProbe:
  enabled: true
  httpGet:
    path: /
    port: 8083
  failureThreshold: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /connectors
    port: 8083
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 8083
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 5

# -----------------------------------------------------------------------------
# Persistence
# -----------------------------------------------------------------------------
persistence:
  enabled: false

# -----------------------------------------------------------------------------
# Security Context
# -----------------------------------------------------------------------------
podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

# -----------------------------------------------------------------------------
# Scheduling
# -----------------------------------------------------------------------------
nodeSelector: {}

affinity: {}

tolerations: []

# -----------------------------------------------------------------------------
# Metrics
# -----------------------------------------------------------------------------
metrics:
  enabled: true

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: INFO

autoscaling:
  enabled: false