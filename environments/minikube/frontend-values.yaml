# =============================================================================
# Todo CDC Platform
# Frontend Values - Minikube
# =============================================================================

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: 2024dock/cdc-frontend
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels:
  app: frontend
  component: ui
  environment: minikube

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: todo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  NODE_ENV: production
  APP_NAME: "Todo CDC Platform"
  APP_VERSION: "v26.100.1"
  LOG_LEVEL: "info"
  ENABLE_ANALYTICS: "false"
  API_BASE_URL: "http://raju-stack-backend:8080/api"
  WS_BASE_URL: "ws://raju-stack-backend:8080/ws"
  REACT_APP_ELASTICSEARCH_URL: ""
  REACT_APP_KIBANA_URL: ""

env:
  REACT_APP_API_URL: "http://todo.local/api"
  REACT_APP_APP_NAME: "Todo CDC Platform"
  REACT_APP_VERSION: "v26.100.1"
  REACT_APP_ENVIRONMENT: "minikube"

secret: {}

envFromConfigMap: true
envFromSecret: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

startupProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  failureThreshold: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

nodeSelector: {}

affinity: {}

tolerations: []

securityContext:
  fsGroup: 101

containerSecurityContext:
  runAsUser: 101
  runAsGroup: 101
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

terminationGracePeriodSeconds: 30

nginx:
  workerProcesses: auto
  gzip:
    enabled: true
  clientMaxBodySize: 10m
  keepaliveTimeout: 65

persistence:
  enabled: false