# --- BACKEND ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cdc-todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: cdc-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/tododb"
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch:9200"
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cdc-todo-app
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
---
# --- CDC CONSUMER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: cdc-todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: cdc-consumer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKER
              value: "kafka:9092"
            - name: KAFKA_TOPIC
              value: "postgres.public.todos"
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch:9200"
---
# --- FRONTEND ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cdc-todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: cdc-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cdc-todo-app
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
# --- KOWL (REDPANDA CONSOLE) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kowl
  namespace: cdc-todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kowl
  template:
    metadata:
      labels:
        app: kowl
    spec:
      containers:
        - name: kowl
          image: docker.redpanda.com/redpandadata/console:v2.5.2
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kowl
  namespace: cdc-todo-app
spec:
  type: NodePort
  selector:
    app: kowl
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
---
# --- KIBANA ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: cdc-todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.13.1
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
          ports:
            - containerPort: 5601
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: cdc-todo-app
spec:
  type: NodePort
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601
      nodePort: 30561