apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cdc-todo-app
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        command: ["postgres", "-c", "wal_level=logical"]
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: tododb
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cdc-todo-app
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
