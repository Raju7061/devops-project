apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: cdc-todo-app
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS todos (
      id SERIAL PRIMARY KEY,
      title VARCHAR(255) NOT NULL,
      description TEXT,
      completed BOOLEAN DEFAULT FALSE,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    ALTER TABLE todos REPLICA IDENTITY FULL;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cdc-todo-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - "/etc/prometheus/alert.rules.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'postgres-exporter'
        static_configs:
          - targets: ['postgres-exporter:9187']

      - job_name: 'kafka-exporter'
        static_configs:
          - targets: ['kafka-exporter:9308']

      - job_name: 'elasticsearch-exporter'
        static_configs:
          - targets: ['elasticsearch-exporter:9114']

      - job_name: 'blackbox-http'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://frontend:80
              - http://backend:5000/health
              - http://debezium:8083/connectors
              - http://elasticsearch:9200
              - http://kowl:8080
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

  alert.rules.yml: |
    groups:
      - name: kafka_cdc_alerts
        rules:
          - alert: KafkaConsumerLagHigh
            expr: sum by (consumergroup, topic) (kafka_consumergroup_lag_sum or kafka_consumergroup_lag) >= 5000
            for: 10s
            labels:
              severity: critical
            annotations:
              summary: "High Kafka Consumer Lag detected: {{ $labels.consumergroup }}"
              description: "Consumer group '{{ $labels.consumergroup }}' on topic '{{ $labels.topic }}' has a lag of {{ $value }} messages (threshold >= 5000)."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: cdc-todo-app
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200, 201, 204]
          method: GET
          no_follow_redirects: false
          fail_if_ssl: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: cdc-todo-app
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: 'https://hooks.slack.com/services/T08SAG77C1W/YOUR/REAL/WEBHOOK_URL'

    route:
      group_by: ['alertname', 'consumergroup', 'topic']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      receiver: 'slack-notifications'

    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - channel: '#all-devops-alerts'
            send_resolved: true
            title: '🚨 [{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
            text: >-
              *Details:* {{ .CommonAnnotations.description }}
              *Severity:* `{{ .CommonLabels.severity }}`
              *Consumer Group:* `{{ .CommonLabels.consumergroup }}`
              *Topic:* `{{ .CommonLabels.topic }}`
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: cdc-todo-app
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true